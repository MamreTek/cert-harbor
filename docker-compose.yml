services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cert_harbor}
      POSTGRES_USER: ${POSTGRES_USER:-cert_harbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cert_harbor_local_only}
    volumes:
      - cert_harbor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  cert-harbor:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CERT_HARBOR_ENV: ${CERT_HARBOR_ENV:-development}
      CERT_HARBOR_DEMO: ${CERT_HARBOR_DEMO:-0}
      CERT_HARBOR_FIXTURE_PATH: ${CERT_HARBOR_FIXTURE_PATH:-examples/demo-fixture.json}
      CERT_HARBOR_DATA_PATH: ${CERT_HARBOR_DATA_PATH:-/app/data/cert-harbor.json}
      CERT_HARBOR_ALERTS_PATH: ${CERT_HARBOR_ALERTS_PATH:-/app/data/cert-harbor-alerts.json}
      CERT_HARBOR_NOTIFICATIONS_PATH: ${CERT_HARBOR_NOTIFICATIONS_PATH:-/app/data/cert-harbor-notifications.json}
      CERT_HARBOR_DATABASE_URL: ${CERT_HARBOR_DATABASE_URL:-postgres://${POSTGRES_USER:-cert_harbor}:${POSTGRES_PASSWORD:-cert_harbor_local_only}@postgres:5432/${POSTGRES_DB:-cert_harbor}?sslmode=disable}
      CERT_HARBOR_SYNC_INTERVAL: ${CERT_HARBOR_SYNC_INTERVAL:-24h}
      CERT_HARBOR_ADMIN_TOKEN: ${CERT_HARBOR_ADMIN_TOKEN:-}
      CERT_HARBOR_VIEWER_TOKEN: ${CERT_HARBOR_VIEWER_TOKEN:-}
      CERT_HARBOR_ENCRYPTION_KEY: ${CERT_HARBOR_ENCRYPTION_KEY:-}
    ports:
      - "${CERT_HARBOR_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cert_harbor_data:/app/data

volumes:
  cert_harbor_data:
  cert_harbor_postgres:
